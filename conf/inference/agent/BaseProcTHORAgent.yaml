defaults:
  - /server@server: PrivilegedProcTHORServer
  - /perception@perception_pipeline: AgentPerceptionPipeline
  - /mapping@mapping_factory: ObjectMapFactory
  - /segmentation@perception_pipeline.segmentation_model: SAM3
  - /vlm@verifier: OpenAIVerifier
  - /inference/agent_query_engine@query_engine: QueryObjects

# This is a placeholder, it will be overridden by the child config
_target_: ???
sim: null
name: ???

# Shared Agent hyperparameters
top_k: ${top_k}
max_attempts: ${max_attempts}
goal_thresh: ${goal_thresh}
step_every: ${step_every}
do_update: ${do_update}
predict_every: ${predict_every}
obj_threshold: ${obj_threshold}
max_iterations: ${max_iterations}
model: "openai:gpt-5.2"

device: ${device}

perception_pipeline:
  min_points_pcd: 5
  min_mask_area_px: 50

semantic_sim:
  _target_: concept_graphs.mapping.similarity.semantic.CosineSimilarity01

update_map_query_top_k: 3
update_map_query_hungarian: true

# Common verifier configuration
verifier:
  max_images: 3
  retry_attempts: 3
  verify_mode: single
  model: gpt-5-mini
